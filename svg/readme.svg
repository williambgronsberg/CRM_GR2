<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1580" viewBox="0 0 860 1580">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .mono { font-family: monospace; }
      .white { fill: white; }
      .green { fill: rgb(127,209,185); }
      .dim { fill: #888; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="1580" fill="rgb(229,99,153)"/>

  <!-- NAV -->
  <text x="48" y="52" font-size="26" font-weight="700" fill="white" letter-spacing="2">Crm gr2</text>
  <text x="560" y="52" font-size="16" font-weight="500" fill="white" opacity="0.9">bedrifter</text>
  <text x="672" y="52" font-size="16" font-weight="500" fill="white" opacity="0.9">Om oss</text>
  <circle cx="810" cy="44" r="26" fill="rgb(122,101,99)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <text x="810" y="50" font-size="13" font-weight="700" fill="rgb(211,165,136)" text-anchor="middle">WG</text>

  <!-- HERO -->
  <text x="430" y="118" font-size="54" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4">CRM GR2</text>
  <text x="430" y="148" font-size="14" fill="white" text-anchor="middle" opacity="0.85">Et enkelt CRM-prosjekt for kunde- og personadministrasjon — bygget i PHP</text>

  <!-- Badges -->
  <rect x="148" y="164" width="90" height="24" rx="12" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="193" y="181" font-size="11" font-weight="600" fill="white" text-anchor="middle">PHP 8.0+</text>
  <rect x="248" y="164" width="70" height="24" rx="12" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="283" y="181" font-size="11" font-weight="600" fill="white" text-anchor="middle">MySQL</text>
  <rect x="328" y="164" width="56" height="24" rx="12" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="356" y="181" font-size="11" font-weight="600" fill="white" text-anchor="middle">PDO</text>
  <rect x="394" y="164" width="122" height="24" rx="12" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="455" y="181" font-size="11" font-weight="600" fill="white" text-anchor="middle">GitHub OAuth</text>
  <rect x="526" y="164" width="126" height="24" rx="12" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="589" y="181" font-size="11" font-weight="600" fill="white" text-anchor="middle">Apache / XAMPP</text>

  <!-- ===================== CARD: Om prosjektet y=206 h=86 ===================== -->
  <rect x="48" y="214" width="780" height="86" rx="16" fill="#323232"/>
  <rect x="40" y="206" width="780" height="86" rx="16" fill="rgb(127,209,185)" stroke="#323232" stroke-width="4"/>
  <text x="64" y="234" font-size="18" font-weight="700" fill="white">Om prosjektet</text>
  <line x1="64" y1="240" x2="796" y2="240" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="64" y="260" font-size="12" fill="white" opacity="0.92">CRM GR2 er en webapplikasjon for å administrere kunder og kontaktpersoner.</text>
  <text x="64" y="278" font-size="12" fill="white" opacity="0.92">Støtter innlogging via brukernavn/passord eller GitHub OAuth.</text>

  <!-- ===================== CARD: Funksjoner y=308 h=182 ===================== -->
  <rect x="48" y="316" width="780" height="182" rx="16" fill="#323232"/>
  <rect x="40" y="308" width="780" height="182" rx="16" fill="rgb(127,209,185)" stroke="#323232" stroke-width="4"/>
  <text x="64" y="336" font-size="18" font-weight="700" fill="white">Funksjoner</text>
  <line x1="64" y1="342" x2="796" y2="342" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <rect x="56" y="350" width="374" height="40" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="72" y="375" font-size="12" fill="white">🏢  Legg til, oppdater og slett kunder</text>
  <rect x="442" y="350" width="374" height="40" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="458" y="375" font-size="12" fill="white">👤  Administrer kontaktpersoner</text>

  <rect x="56" y="398" width="374" height="40" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="72" y="423" font-size="12" fill="white">🔐  Innlogging med brukernavn &amp; passord</text>
  <rect x="442" y="398" width="374" height="40" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="458" y="423" font-size="12" fill="white">🐙  GitHub OAuth-pålogging</text>

  <rect x="56" y="446" width="374" height="40" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="72" y="471" font-size="12" fill="white">📋  Listevisning av kunder &amp; personer</text>
  <rect x="442" y="446" width="374" height="40" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="458" y="471" font-size="12" fill="white">⚙️  Rediger brukerkonto &amp; profil</text>

  <!-- ===================== CARD: Prosjektstruktur y=510 h=310 ===================== -->
  <rect x="48" y="518" width="780" height="310" rx="16" fill="#323232"/>
  <rect x="40" y="510" width="780" height="310" rx="16" fill="rgb(127,209,185)" stroke="#323232" stroke-width="4"/>
  <text x="64" y="538" font-size="18" font-weight="700" fill="white">Prosjektstruktur</text>
  <line x1="64" y1="544" x2="796" y2="544" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="56" y="552" width="760" height="260" rx="10" fill="#323232" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <text x="76" y="576" font-size="12" class="mono" fill="#eee">.</text>
  <text x="76" y="595" font-size="12" class="mono" fill="#eee">├── index.php</text>
  <text x="76" y="614" font-size="12" class="mono" fill="rgb(127,209,185)" font-weight="700">├── assets/</text>
  <text x="76" y="633" font-size="12" class="mono" fill="#eee">│   └── style.css</text>
  <text x="76" y="652" font-size="12" class="mono" fill="rgb(127,209,185)" font-weight="700">├── database/</text>
  <text x="76" y="671" font-size="12" class="mono" fill="#eee">│   ├── connect.php</text>
  <text x="76" y="690" font-size="12" class="mono" fill="#eee">│   └── crm_g2.sql</text>
  <text x="76" y="709" font-size="12" class="mono" fill="rgb(127,209,185)" font-weight="700">├── pages/</text>
  <text x="76" y="728" font-size="12" class="mono" fill="#eee">│   ├── login.php  register.php  logout.php  auth_check.php</text>
  <text x="76" y="747" font-size="12" class="mono" fill="#eee">│   ├── github_callback.php  list_customers.php  add_customer.php</text>
  <text x="76" y="766" font-size="12" class="mono" fill="#eee">│   ├── update_customer.php  delete_customer.php  list_people.php</text>
  <text x="76" y="785" font-size="12" class="mono" fill="#eee">│   ├── add_person.php  update_person.php  delete_person.php</text>
  <text x="76" y="804" font-size="12" class="mono" fill="#eee">│   ├── update_account.php  about_us.php</text>
  <text x="76" y="823" font-size="12" class="mono" fill="rgb(127,209,185)" font-weight="700">│   └── pieces/  </text>
  <text x="220" y="823" font-size="12" class="mono" fill="#888">head.php  nav.php  footer.php</text>

  <!-- ===================== CARD: Kom i gang y=840 h=240 ===================== -->
  <rect x="48" y="848" width="780" height="240" rx="16" fill="#323232"/>
  <rect x="40" y="840" width="780" height="240" rx="16" fill="rgb(127,209,185)" stroke="#323232" stroke-width="4"/>
  <text x="64" y="868" font-size="18" font-weight="700" fill="white">Kom i gang</text>
  <line x1="64" y1="874" x2="796" y2="874" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <text x="64" y="896" font-size="12" fill="white" opacity="0.85">1. Importer databasen:</text>
  <rect x="56" y="904" width="760" height="28" rx="8" fill="#323232" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="72" y="922" font-size="12" class="mono" fill="rgb(127,209,185)">mysql -u root -p &lt; database/crm_g2.sql</text>

  <text x="64" y="950" font-size="12" fill="white" opacity="0.85">2. Start lokal utviklingsserver:</text>
  <rect x="56" y="958" width="760" height="28" rx="8" fill="#323232" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="72" y="976" font-size="12" class="mono" fill="rgb(127,209,185)">php -S localhost:8000</text>

  <text x="64" y="1004" font-size="12" fill="white" opacity="0.85">3. Åpne i nettleser:</text>
  <rect x="56" y="1012" width="760" height="28" rx="8" fill="#323232" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="72" y="1030" font-size="12" class="mono" fill="rgb(127,209,185)">http://localhost:8000</text>

  <text x="64" y="1064" font-size="11" fill="white" opacity="0.7">⚠️  GitHub OAuth krever at redirect_uri i github_callback.php matcher din registrerte OAuth-app.</text>

  <!-- ===================== CARD: Status y=1100 h=240 ===================== -->
  <rect x="48" y="1108" width="780" height="240" rx="16" fill="#323232"/>
  <rect x="40" y="1100" width="780" height="240" rx="16" fill="rgb(127,209,185)" stroke="#323232" stroke-width="4"/>
  <text x="64" y="1128" font-size="18" font-weight="700" fill="white">Status</text>
  <line x1="64" y1="1134" x2="796" y2="1134" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <circle cx="76" cy="1158" r="7" fill="#5dde8a"/>
  <text x="94" y="1163" font-size="12" fill="white">Autentisering — login, register, GitHub OAuth</text>
  <circle cx="76" cy="1190" r="7" fill="#5dde8a"/>
  <text x="94" y="1195" font-size="12" fill="white">Kundeliste med modal for å legge til</text>
  <circle cx="76" cy="1222" r="7" fill="#5dde8a"/>
  <text x="94" y="1227" font-size="12" fill="white">Profilvisning og redigering av konto</text>
  <circle cx="76" cy="1254" r="7" fill="#5dde8a"/>
  <text x="94" y="1259" font-size="12" fill="white">Navigasjonsbar med profilmodal</text>
  <circle cx="76" cy="1286" r="7" fill="rgb(211,165,136)"/>
  <text x="94" y="1291" font-size="12" fill="white">Oppdater / slett kunde &amp; kontaktpersoner (CRUD)</text>
  <circle cx="76" cy="1318" r="7" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="2"/>
  <text x="94" y="1323" font-size="12" fill="white">Om oss-side</text>

  <text x="64" y="1328" font-size="11" fill="white" opacity="0.6">  🟢 Ferdig   🟡 Under arbeid   ⚪ Ikke startet</text>

  <!-- ===================== CARD: Forfatter y=1366 h=100 ===================== -->
  <rect x="48" y="1374" width="780" height="100" rx="16" fill="#323232"/>
  <rect x="40" y="1366" width="780" height="100" rx="16" fill="rgb(127,209,185)" stroke="#323232" stroke-width="4"/>
  <text x="64" y="1394" font-size="18" font-weight="700" fill="white">Forfatter</text>
  <line x1="64" y1="1400" x2="796" y2="1400" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="56" y="1410" width="760" height="46" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="84" cy="1433" r="16" fill="rgb(122,101,99)" stroke="#323232" stroke-width="2"/>
  <text x="84" y="1438" font-size="11" font-weight="700" fill="rgb(211,165,136)" text-anchor="middle">WG</text>
  <text x="112" y="1429" font-size="13" font-weight="700" fill="white">William Berge Groensberg</text>
  <text x="112" y="1447" font-size="11" fill="white" opacity="0.7">Sist oppdatert: 2026-03-07</text>

  <!-- Footer -->
  <text x="430" y="1570" font-size="11" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="2">CRM GR2 — Ingen lisens er spesifisert ennå</text>
</svg>
